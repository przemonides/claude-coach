<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Claude Tinder — find your Claude Code collaborator</title>
  <meta name="description" content="Swipe through profiles of fellow Claude Code creators and find your next collaboration partner." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        Claude Tinder
        <small>find your Claude Code collaborator</small>
      </div>
      <nav class="nav">
        <a href="likes.html">♥ Shortlist</a>
        <a href="new-profile.html">+ Add you</a>
      </nav>
    </header>

    <div id="deck" class="deck" aria-live="polite"></div>

    <div class="actions" id="actions">
      <button class="action pass" id="btn-pass" title="Pass (←)" aria-label="Pass">✕</button>
      <button class="action like" id="btn-like" title="Like (→)" aria-label="Like">♥</button>
    </div>

    <div class="footer">
      Drag the card · ← pass · → like · No accounts, no server — your shortlist lives in this browser.
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
